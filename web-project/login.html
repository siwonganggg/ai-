<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 - AI 문제 생성기</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================
         다크 / 라이트 모드 버튼
    ====================================== -->

    <button
        id="themeToggle"
        type="button"
    >
        다크 모드
    </button>


    <!-- =====================================
         로그인
    ====================================== -->

    <div class="auth-container">

        <h1>로그인</h1>

        <p class="subtitle">
            AI 문제 생성기에 로그인해주세요.
        </p>


        <form id="loginForm">

            <label for="username">
                아이디
            </label>

            <input
                type="text"
                id="username"
                placeholder="아이디를 입력하세요"
                autocomplete="username"
                required
            >


            <label for="password">
                비밀번호
            </label>

            <input
                type="password"
                id="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                로그인
            </button>

        </form>


        <!-- 메시지 -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- 회원가입 -->

        <p class="auth-link">

            계정이 없나요?

            <a href="signup.html">
                회원가입
            </a>

        </p>


        <!-- 메인으로 -->

        <p class="auth-link">

            <a href="index.html">
                메인으로 돌아가기
            </a>

        </p>

    </div>


    <!-- =====================================
         JS
         
         ★ auth.js 먼저
         ★ login.js 나중
    ====================================== -->

    <script src="auth.js"></script>
    <script src="login.js"></script>

</body>

</html>
