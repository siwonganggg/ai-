<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입 - AI 문제 생성기</title>

    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="themeToggle" type="button">
        다크 모드
    </button>

    <div class="auth-container">

        <h1>회원가입</h1>

        <p class="auth-subtitle">
            AI 문제 생성기를 이용하려면 회원가입이 필요합니다.
        </p>

        <form id="signupForm">

            <label for="username">
                아이디
            </label>

            <input
                type="text"
                id="username"
                placeholder="아이디를 입력하세요"
                autocomplete="username"
                required
            >

            <label for="password">
                비밀번호
            </label>

            <input
                type="password"
                id="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="new-password"
                required
            >

            <label for="passwordConfirm">
                비밀번호 확인
            </label>

            <input
                type="password"
                id="passwordConfirm"
                placeholder="비밀번호를 다시 입력하세요"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                class="auth-button"
            >
                회원가입
            </button>

        </form>

        <p id="signupMessage"></p>

        <div class="auth-link">
            이미 계정이 있나요?

            <a href="login.html">
                로그인
            </a>
        </div>

        <div class="auth-link">
            <a href="index.html">
                메인으로 돌아가기
            </a>
        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
