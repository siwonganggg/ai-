<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI 문제 생성기</title>

    <!-- Puter AI -->
    <script src="https://js.puter.com/v2/"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            text-align:center;
            padding:50px;
        }

        h1{
            color:#333;
        }

        textarea{
            width:80%;
            height:180px;
            padding:15px;
            font-size:16px;
            border-radius:10px;
            border:1px solid #ccc;
            resize:none;
        }

        button{
            margin-top:15px;
            padding:12px 24px;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        #loginBtn{
            background:#4285F4;
            color:white;
        }

        #generateBtn{
            background:#4CAF50;
            color:white;
        }

        #result{
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:10px;
            width:80%;
            margin-left:auto;
            margin-right:auto;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        #output{
            white-space:pre-wrap;
            text-align:left;
        }

    </style>
</head>

<body>

    <h1> AI 문제 생성기</h1>

    <p>
        공부 내용을 입력하면 AI가 문제를 생성합니다.
    </p>

    <!-- 로그인 버튼 -->
    <button id="loginBtn" onclick="login()">
        Puter 로그인
    </button>

    <br><br>

    <!-- 입력창 -->
    <textarea
        id="inputText"
        placeholder="예시:
OSI 7계층은 네트워크 통신을 7단계로 나눈 모델이다...">
    </textarea>

    <br>

    <!-- 문제 생성 버튼 -->
    <button id="generateBtn" onclick="generateQuestion()">
        문제 생성하기
    </button>

    <!-- 결과 -->
    <div id="result">

        <h3>생성된 문제</h3>

        <p id="output">
            여기에 AI 문제가 생성됩니다.
        </p>

    </div>

<script>

    // 로그인 함수
    async function login(){

        try{

            await puter.auth.signIn();

            alert(" 로그인 성공!");

        }

        catch(err){

            console.error(err);

            alert(" 로그인 실패");
        }
    }

    // 문제 생성 함수
    async function generateQuestion(){

        const text =
        document.getElementById("inputText").value;

        // 입력 확인
        if(!text.trim()){

            alert("공부 내용을 입력하세요!");

            return;
        }

        // 로딩 표시
        document.getElementById("output").innerText =
        " AI가 문제 생성중...";

        try{

            // AI 요청
            const response =
            await puter.ai.chat(

`다음 공부 내용을 기반으로
객관식 문제 3개를 만들어줘.

조건:
- 보기 4개 만들기
- 정답도 표시하기
- 한국어로 출력

공부 내용:
${text}`

            );

            console.log(response);

            // 응답 출력
            if(response?.message?.content){

                document.getElementById("output").innerText =
                response.message.content[0].text;
}
            else{

                document.getElementById("output").innerText =
                " AI 응답 없음";
            }

        }

        catch(err){

            console.error(err);

            document.getElementById("output").innerText =
            " 오류 발생\n\n" +
            "1. Puter 로그인 확인\n" +
            "2. 크롬 브라우저 사용\n" +
            "3. 새로고침 후 다시 시도";
        }
    }

</script>

</body>
</html>
